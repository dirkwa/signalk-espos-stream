name: Container image

# Publishes ghcr.io/dirkwa/signalk-espos-stream:<version> in lockstep with
# the npm release: imageTag "auto" in the plugin resolves to its own
# package.json version, so every vX.Y.Z tag must produce the matching image.
on:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/dirkwa/signalk-espos-stream"
          docker build -t "$image:$version" -t "$image:latest" container/
          docker push "$image:$version"
          docker push "$image:latest"
