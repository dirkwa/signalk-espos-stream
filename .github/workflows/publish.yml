name: Publish

# Called by release-please.yml once it has tagged a release. The tag version
# must equal package.json's version (imageTag "auto" resolves to it at
# runtime), the container image must be pushed before the npm package
# publishes, and a failure anywhere stops the chain -- so an installed plugin
# can never resolve "auto" to an image tag that was not published.
#
# There is deliberately no tag trigger of its own: npm's trusted publisher
# names one workflow, and it is the caller. To recover a failed publish,
# re-run the failed jobs of that release-please run.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v0.2.0
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Tag must match package.json version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag_version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "releasing ${pkg_version}"

  image:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/dirkwa/signalk-espos-stream"
          docker build -t "$image:$version" container/
          docker push "$image:$version"
          # `latest` tracks stable releases only — a beta pushed as latest
          # would reach container users who never opted into the npm
          # prerelease channel.
          case "$TAG" in
            *alpha* | *beta* | *rc*)
              echo "prerelease tag — not updating latest"
              ;;
            *)
              docker tag "$image:$version" "$image:latest"
              docker push "$image:latest"
              ;;
          esac

  publish:
    # npm publishes LAST: once the package is on the registry, every
    # install can resolve imageTag "auto" to an image that already exists.
    needs: image
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5; npm 12 breaks
      # --provenance ("Cannot find module 'sigstore'"). Pin 11.
      - run: npm install -g npm@^11

      - run: npm ci

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$TAG" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$TAG" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi
