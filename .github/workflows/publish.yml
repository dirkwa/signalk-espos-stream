# Cuts releases from the history, the way espOS and the cockpit do: every
# push to master refreshes a "chore: release x.y.z" pull request carrying the
# changelog and the package.json bump, and merging that PR tags the release
# and publishes it. feat bumps minor, fix bumps patch, a `!` bumps major.
#
# Releasing and publishing share one workflow because a release created with
# the workflow's own token never starts another workflow, so a tag trigger
# would never fire, and because npm's trusted publisher names the workflow
# that runs `npm publish`. It is called publish.yml like in every other
# plugin repo. To recover a failed publish, re-run its failed jobs, or run
# this workflow by hand with the release tag once the fix is on master.
#
# The tag version must equal package.json's version (imageTag "auto"
# resolves to it at runtime), the container image must be pushed before the
# npm package publishes, and a failure anywhere stops the chain -- so an
# installed plugin can never resolve "auto" to an image tag that was not
# published.
#
# The release PR, though, is opened with a GitHub App's token
# (RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY): GitHub holds the checks of a
# PR opened with the workflow token until a maintainer approves them, while
# an App's PR runs them at once. So release-please runs twice, the release
# with the workflow token and the PR with the App's. Without the secrets the
# PR falls back to the workflow token, and its checks wait for approval.
name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.1.1
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # A flag, because a step's `if` cannot read secrets. Only the flag: the
      # key itself in the job environment would reach every step.
      APP_CONFIGURED: >-
        ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Get the App token for the release PR
        id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          token: ${{ steps.app-token.outputs.token || github.token }}

  verify:
    needs: release-please
    # !cancelled(), because the release is already out by the time the PR step
    # can fail; whether to publish is answered by release_created alone. A
    # tagged release whose image never pushed is exactly issue #18.
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The publish jobs build this exact commit rather than re-resolving the
    # tag, which could have moved since it was checked here.
    outputs:
      commit_sha: ${{ steps.verified.outputs.commit_sha }}
      is_latest: ${{ steps.verified.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
          fetch-depth: 0

      # A manual run may name any tag, so it publishes only one that is
      # already a published release and reachable from master -- the same
      # thing a release-please run would have published.
      - name: Manual runs publish only released tags on master
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::${TAG} is not a published release"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" FETCH_HEAD; then
            echo "::error::${TAG} is not on master"
            exit 1
          fi

      - name: Tag must match package.json version
        id: verified
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          tag_version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "releasing ${pkg_version}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Only the highest stable tag may move `latest`, so republishing
          # an older release by hand cannot roll users back.
          newest=$(git tag -l 'v*' --sort=-v:refname | grep -Ev 'alpha|beta|rc' | head -n1)
          if [ "$TAG" = "$newest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [release-please, verify]
    # The release environment admits only master. npm's trusted publisher
    # names it, so a workflow edited on a side branch cannot publish to npm.
    environment: release
    # needs on a failed release-please job would skip this even after verify
    # passed; publish whenever the release exists and verify succeeded.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          IS_LATEST: ${{ needs.verify.outputs.is_latest }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/dirkwa/signalk-espos-stream"
          docker build -f container/Containerfile -t "$image:$version" container/
          docker push "$image:$version"
          # `latest` tracks the newest stable release only — a beta pushed as
          # latest would reach container users who never opted into the npm
          # prerelease channel.
          if [ "$IS_LATEST" = "true" ]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          else
            echo "not the newest stable tag — not updating latest"
          fi

  publish:
    # npm publishes LAST: once the package is on the registry, every
    # install can resolve imageTag "auto" to an image that already exists.
    needs: [release-please, verify, image]
    environment: release
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5; npm 12 breaks
      # --provenance ("Cannot find module 'sigstore'"). Pin 11.
      - run: npm install -g npm@^11

      - run: npm ci

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          IS_LATEST: ${{ needs.verify.outputs.is_latest }}
        run: |
          version="${TAG#v}"
          # A manual re-run of a release that already reached npm has
          # nothing left to publish; npm would reject the version anyway.
          if [ "$(npm view "signalk-espos-stream@${version}" version 2>/dev/null)" = "$version" ]; then
            echo "${version} is already on npm"
            exit 0
          fi
          if [[ "$TAG" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$TAG" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$TAG" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          elif [ "$IS_LATEST" = "true" ]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag previous
          fi
